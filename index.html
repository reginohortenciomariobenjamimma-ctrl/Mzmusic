<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MozMusic — Música Moçambicana</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0f14;
  color:white;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 5%;
  background:#111820;
  border-bottom:1px solid #26313c;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#19d47b;
}

.logo span{
  color:white;
}

nav{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

nav a{
  color:#ddd;
  text-decoration:none;
  font-size:14px;
}

nav a:hover{
  color:#19d47b;
}

.hero{
  text-align:center;
  padding:65px 20px 45px;
  max-width:900px;
  margin:auto;
}

.badge{
  display:inline-block;
  background:#15231d;
  border:1px solid #28553f;
  color:#7ee7ae;
  padding:7px 12px;
  border-radius:30px;
  font-size:13px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(30px,7vw,52px);
  line-height:1.1;
}

.hero h1 span{
  color:#19d47b;
}

.hero p{
  color:#aeb7c2;
  margin-top:15px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:25px;
}

.btn{
  border:0;
  border-radius:25px;
  padding:12px 20px;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
}

.primary{
  background:#19d47b;
  color:#06110b;
}

.secondary{
  background:#202a34;
  color:white;
}

.section{
  max-width:1050px;
  margin:auto;
  padding:25px 20px;
}

.section-title{
  margin-bottom:18px;
  font-size:22px;
}

.search{
  width:100%;
  padding:14px;
  margin-bottom:20px;
  background:#151d26;
  border:1px solid #303b47;
  border-radius:10px;
  color:white;
  outline:none;
}

.music-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

.card{
  background:#151d26;
  border:1px solid #26313c;
  border-radius:15px;
  padding:15px;
}

.cover{
  height:190px;
  border-radius:12px;
  background:linear-gradient(135deg,#19d47b,#17232d);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  margin-bottom:14px;
}

.card h3{
